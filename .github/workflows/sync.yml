# .github/workflows/sync.yml
name: Sync Subscription

on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时同步一次
  workflow_dispatch:  # 也可以手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Fetch subscription
        run: |
          curl -L -o sub.txt "https://jmssub.net/members/getsub.php?service=658183&id=6e86c465-595b-4a1c-a69e-5e8da5394b90"
          
      - name: Commit and push
        run: |
          git config user.name "bot"
          git config user.email "bot@example.com"
          git add sub.txt
          git diff --cached --quiet || git commit -m "sync sub"
          git push
