name: Sync Subscription

on:
  schedule:
    - cron: '*/30 * * * *'    # 每30分钟同步一次
  workflow_dispatch:          # 允许手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch subscription
        run: |
          echo "Downloading subscription..."
          curl -L -f -o sub.txt "${{ secrets.SUB_URL }}" || {
            echo "Failed to download subscription"
            exit 1
          }
          echo "Downloaded $(wc -c < sub.txt) bytes"
          head -c 200 sub.txt
          echo ""

      - name: Commit and push
        run: |
          git config user.name "sub-bot"
          git config user.email "bot@example.com"
          
          git add sub.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Sync subscription $(date -u +%Y-%m-%d_%H:%M)"
          
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "Current branch: $BRANCH"
          
          git push origin "$BRANCH"
